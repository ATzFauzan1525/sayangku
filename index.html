<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>💞 Dunia Berputar di Sekelilingmu 💞</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f9d1ff, #ffe3b3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    h1 {
      color: #ff3c8b;
      text-shadow: 2px 2px 5px white;
      margin-bottom: 10px;
    }

    .photo-section {
      position: relative;
      width: 480px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* orbit landmark mengelilingi foto */
    .orbit-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 480px;
      height: 480px;
      transform: translate(-50%, -50%);
      animation: orbitRotate 30s linear infinite;
    }

    .orbit-container img {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 480px;
      object-fit: contain;
      opacity: 0.9;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4));
    }

    @keyframes orbitRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* foto kekasih di tengah */
    .photo-frame {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid #ff7eb3;
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.4);
      animation: pulse 3s ease-in-out infinite;
      z-index: 5;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 0, 100, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 0, 100, 0.6); }
    }

    /* kotak pesan cinta */
    .message-box {
      text-align: center;
      color: #ff0077;
      font-size: 1.1em;
      margin-top: 15px;
      max-width: 400px;
      animation: fadeIn 2s ease-in-out;
    }

    .highlight {
      color: #ff3c8b;
      font-weight: bold;
    }

    #quote {
      font-style: italic;
      color: #444;
      margin-top: 5px;
      font-size: 0.9em;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* tombol kecepatan animasi */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #ff6ec7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 0, 100, 0.3);
      transition: transform 0.2s;
    }

    .controls button:hover {
      transform: scale(1.1);
      background-color: #ff4081;
    }
  </style>
</head>
<body>
  <h1>💞 Dunia Berputar di Sekelilingmu 💞</h1>

  <div class="photo-section">
    <!-- Gambar landmark berputar -->
    <div class="orbit-container" id="orbitContainer">
      <img src="png-transparent-world-travel-attractions-landmark-material-globe-city-happy-birthday-vector-images.png" alt="Landmarks Orbit">
    </div>

    <!-- Foto pacar statis -->
    <div class="photo-frame">
      <img src="profile-photo1.jpeg" alt="Foto Pacar">
    </div>
  </div>

  <!-- Pesan romantis -->
  <div class="message-box" id="messageBox">
    <p>Bersamamu, aku ingin <span class="highlight">menjelajahi setiap sudut dunia</span> ini.</p>
    <p>Dari Menara Eiffel hingga Taj Mahal.</p>
    <p>Karena destinasi terindahku <span class="highlight">adalah di sampingmu</span>.</p>
    <div id="quote">"Petualangan terbaik adalah yang kita lalui bersama."</div>
  </div>

  <div class="controls">
    <button onclick="changeSpeed('slow')">🐢 Lambat</button>
    <button onclick="changeSpeed('normal')">✈️ Normal</button>
    <button onclick="changeSpeed('fast')">🚀 Cepat</button>
  </div>

  <script>
    // Ganti kecepatan animasi orbit
    function changeSpeed(speed) {
      const orbit = document.getElementById('orbitContainer');
      orbit.style.animation = 'none';
      setTimeout(() => {
        if (speed === 'slow') {
          orbit.style.animation = 'orbitRotate 50s linear infinite';
        } else if (speed === 'fast') {
          orbit.style.animation = 'orbitRotate 15s linear infinite';
        } else {
          orbit.style.animation = 'orbitRotate 30s linear infinite';
        }
      }, 10);
    }

    // Pesan romantis berganti otomatis
    const messages = [
        {
            text: `<p>Bersamamu, aku ingin <span class="highlight">menjelajahi setiap sudut dunia</span> ini.</p>
                   <p>Dari Menara Eiffel hingga Taj Mahal.</p>
                   <p>Karena destinasi terindahku <span class="highlight">adalah di sampingmu</span>.</p>`,
            quote: '"Petualangan terbaik adalah yang kita lalui bersama."'
        },
        {
            text: `<p>Setiap landmark akan menjadi <span class="highlight">saksi cinta kita</span>.</p>
                   <p>Kota yang kita kunjungi akan menyimpan kenangan indah kita.</p>
                   <p>Mari buat <span class="highlight">album cinta</span> di setiap benua. 📸</p>`,
            quote: '"Tempat tidak penting, yang penting siapa yang bersamamu."'
        },
        {
            text: `<p>Dari barat ke timur, aku ingin <span class="highlight">bersamamu selalu</span>.</p>
                   <p>Menyaksikan matahari terbit dan terbenam bersamamu.</p>
                   <p>Karena setiap momen <span class="highlight">lebih indah denganmu</span>. 🌅</p>`,
            quote: '"You are my favorite destination."'
        }
    ];
    let index = 0;

    function changeMessage() {
        index = (index + 1) % messages.length;
        const box = document.getElementById('messageBox');
        const quote = document.getElementById('quote');
        box.innerHTML = messages[index].text + `<div id="quote">${messages[index].quote}</div>`;
        createParticles();
    }

    setInterval(changeMessage, 7000); // ganti pesan setiap 7 detik

    // Partikel love 💕
    function createParticles() {
        const hearts = ['❤️','💖','💗','✨','🌟','💫','🎈'];
        for (let i=0;i<25;i++){
            const h=document.createElement('div');
            h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
            h.style.position='fixed';
            h.style.left=Math.random()*100+'%';
            h.style.bottom='-10px';
            h.style.fontSize=(Math.random()*1+1)+'em';
            h.style.animation=`floatUp ${3+Math.random()*3}s linear forwards`;
            document.body.appendChild(h);
            setTimeout(()=>h.remove(),5000);
        }
    }

    const style=document.createElement('style');
    style.innerHTML=`@keyframes floatUp {
        from {transform: translateY(0); opacity:1;}
        to {transform: translateY(-120vh); opacity:0;}
    }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
